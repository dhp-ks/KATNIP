version: 1

technologies:
  # ---------------------------------------------------------------------------
  # Google
  # ---------------------------------------------------------------------------

  - id: google-analytics
    name: Google Analytics
    company: Google
    category: analytics
    priority: 100
    description: Website and application analytics measurement.
    match:
      hosts:
        - www.google-analytics.com
        - google-analytics.com
        - analytics.google.com
        - ssl.google-analytics.com
        - region1.google-analytics.com
      host_suffixes:
        - .google-analytics.com
      paths:
        - /collect
        - /g/collect
        - /j/collect

  - id: google-tag-manager
    name: Google Tag Manager
    company: Google
    category: tag_management
    priority: 90
    description: Tag-management and script-deployment platform.
    match:
      hosts:
        - www.googletagmanager.com
        - googletagmanager.com
      host_suffixes:
        - .googletagmanager.com

  - id: google-ads
    name: Google Ads
    company: Google
    category: advertising
    priority: 100
    description: Google advertising measurement, conversion, and remarketing.
    match:
      hosts:
        - googleadservices.com
        - www.googleadservices.com
        - pagead2.googlesyndication.com
        - adservice.google.com
        - adservice.google.ca
      host_suffixes:
        - .googleadservices.com
        - .googlesyndication.com
      paths:
        - /pagead/conversion
        - /pagead/1p-conversion
        - /pagead/viewthroughconversion

  - id: doubleclick
    name: Google DoubleClick
    company: Google
    category: advertising
    priority: 95
    description: Advertising delivery, measurement, and audience services.
    match:
      domains:
        - doubleclick.net
      host_suffixes:
        - .doubleclick.net

  - id: google-publisher-tag
    name: Google Publisher Tag
    company: Google
    category: advertising
    priority: 110
    description: Google Ad Manager advertising requests.
    match:
      hosts:
        - securepubads.g.doubleclick.net
      paths:
        - /gampad/ads

  # ---------------------------------------------------------------------------
  # Meta
  # ---------------------------------------------------------------------------

  - id: meta-pixel
    name: Meta Pixel
    company: Meta
    category: advertising
    priority: 120
    description: Meta advertising conversion and audience measurement.
    match:
      hosts:
        - www.facebook.com
        - facebook.com
      host_suffixes:
        - .facebook.com
      paths:
        - /tr
        - /tr/

  - id: meta-pixel-script
    name: Meta Pixel
    company: Meta
    category: advertising
    priority: 115
    description: Meta Pixel JavaScript library.
    match:
      hosts:
        - connect.facebook.net
      paths:
        - /en_US/fbevents.js
        - /signals/config/

  # ---------------------------------------------------------------------------
  # Microsoft
  # ---------------------------------------------------------------------------

  - id: microsoft-clarity
    name: Microsoft Clarity
    company: Microsoft
    category: session_replay
    priority: 100
    description: Behavioral analytics, heatmaps, and session replay.
    match:
      hosts:
        - www.clarity.ms
        - clarity.ms
      host_suffixes:
        - .clarity.ms

  - id: microsoft-advertising-uet
    name: Microsoft Advertising UET
    company: Microsoft
    category: advertising
    priority: 100
    description: Microsoft Advertising Universal Event Tracking.
    match:
      hosts:
        - bat.bing.com
      paths:
        - /action/0
        - /bat.js

  # ---------------------------------------------------------------------------
  # Adobe
  # ---------------------------------------------------------------------------

  - id: adobe-analytics
    name: Adobe Analytics
    company: Adobe
    category: analytics
    priority: 100
    description: Adobe digital analytics and measurement.
    match:
      host_suffixes:
        - .sc.omtrdc.net
        - .2o7.net
      domains:
        - omtrdc.net
        - 2o7.net

  - id: adobe-experience-platform
    name: Adobe Experience Platform
    company: Adobe
    category: customer_data_platform
    priority: 100
    description: Adobe Experience Platform data collection.
    match:
      host_suffixes:
        - .adobedc.net
        - .demdex.net
      domains:
        - adobedc.net
        - demdex.net

  # ---------------------------------------------------------------------------
  # TikTok
  # ---------------------------------------------------------------------------

  - id: tiktok-pixel
    name: TikTok Pixel
    company: TikTok
    category: advertising
    priority: 110
    description: TikTok advertising measurement and audience collection.
    match:
      hosts:
        - analytics.tiktok.com
        - business-api.tiktok.com
      host_suffixes:
        - .analytics.tiktok.com
      paths:
        - /i18n/pixel/
        - /api/v2/pixel
        - /api/v2/pixel_web_event

  # ---------------------------------------------------------------------------
  # LinkedIn
  # ---------------------------------------------------------------------------

  - id: linkedin-insight-tag
    name: LinkedIn Insight Tag
    company: LinkedIn
    category: advertising
    priority: 110
    description: LinkedIn conversion tracking and audience measurement.
    match:
      hosts:
        - px.ads.linkedin.com
        - snap.licdn.com
      paths:
        - /collect
        - /li.lms-analytics/
        - /insight.min.js

  # ---------------------------------------------------------------------------
  # X / Twitter
  # ---------------------------------------------------------------------------

  - id: x-pixel
    name: X Pixel
    company: X
    category: advertising
    priority: 100
    description: X advertising conversion and audience measurement.
    match:
      hosts:
        - analytics.twitter.com
        - static.ads-twitter.com
      paths:
        - /i/adsct
        - /uwt.js

  # ---------------------------------------------------------------------------
  # Pinterest
  # ---------------------------------------------------------------------------

  - id: pinterest-tag
    name: Pinterest Tag
    company: Pinterest
    category: advertising
    priority: 100
    description: Pinterest conversion and audience measurement.
    match:
      hosts:
        - ct.pinterest.com
        - s.pinimg.com
      paths:
        - /v3/
        - /ct/
        - /core.js

  # ---------------------------------------------------------------------------
  # Snap
  # ---------------------------------------------------------------------------

  - id: snap-pixel
    name: Snap Pixel
    company: Snap
    category: advertising
    priority: 100
    description: Snapchat advertising conversion measurement.
    match:
      hosts:
        - tr.snapchat.com
        - sc-static.net
      paths:
        - /p
        - /scevent.min.js

